name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: clang-format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]   # x86-64 (AVX2 path) and Apple Silicon (NEON path)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitizer, tsan]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          # The GitHub ubuntu-24.04 image uses high mmap ASLR entropy, which breaks TSan.
          TSAN_OPTIONS: halt_on_error=1
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          ctest --preset ${{ matrix.preset }}

  adaptive-study:
    # Run-isolation regression tests for the adaptive-search study (tiny synthetic data).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build adaptive_eval
        run: cmake --preset bench && cmake --build --preset bench --target adaptive_eval
      - run: pip install numpy scikit-learn matplotlib pytest
      - name: pytest
        run: python -m pytest -q bench/ann/adaptive/test_study.py

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install ".[test]"
      - name: pytest
        run: cd /tmp && python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
      - name: README example
        run: cd /tmp && python "$GITHUB_WORKSPACE/tools/run_readme_example.py"

  service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . -r service/requirements.txt httpx pytest
      - name: API tests (FastAPI TestClient)
        run: cd service && python -m pytest -q tests
      - name: Docker image builds
        run: docker build -f service/Dockerfile -t vecsearch-service .
